name: Build & Test AetherForge

on:
  push:
    branches: [main, develop]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - uses: game-ci/unity-test-runner@v4
        with:
          unityVersion: 6000.0.0f1
          testMode: all
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

  build:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        targetPlatform: [StandaloneWindows64, WebGL]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ matrix.targetPlatform }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ matrix.targetPlatform }}-
            Library-${{ runner.os }}-

      - uses: game-ci/unity-builder@v4
        with:
          unityVersion: 6000.0.0f1
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: AetherForge-${{ matrix.targetPlatform }}
          customParameters: -detailedBuildReport
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherForge-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}/

  deploy-webgl:
    name: Deploy WebGL to GitHub Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.1.3
        with:
          name: AetherForge-WebGL
          path: webgl-build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: webgl-build
